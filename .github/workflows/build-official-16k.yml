name: Official core 16KB
on:
  push:
    branches: [ci/official-16k]
  workflow_dispatch:
    inputs:
      ref:
        description: MobileGL source ref to build
        required: true
        default: dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'dev' }}
          submodules: recursive

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.3.13750724"

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Configure (16 KB pages, shipping monolith)
        run: |
          cmake -S . -B build-android-16k -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DMOBILEGL_ENABLE_LTO=ON \
            -DMOBILEGL_BUILD_DISAGGREGATED=OFF -DMOBILEGL_BUILD_DISAGGREGATED_INPROC=OFF \
            -DMOBILEGL_BUILD_TEST=OFF -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"

      - name: Build libMobileGL.so
        run: cmake --build build-android-16k --target MobileGL -j"$(nproc)"

      - name: Strip and verify
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64"
          OUT=libMobileGL-official-16k.so
          "$NDK/bin/llvm-strip" --strip-unneeded -o "$OUT" build-android-16k/libMobileGL.so
          echo "--- LOAD segments ---"
          "$NDK/bin/llvm-readelf" -l "$OUT" | grep LOAD
          ALIGNS=$("$NDK/bin/llvm-readelf" -l "$OUT" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
          echo "aligns: $ALIGNS"
          if [ "$ALIGNS" != "0x4000 " ]; then
            echo "::error::libMobileGL is not 16 KB aligned (LOAD aligns: $ALIGNS)"
            exit 1
          fi
          echo "--- version ---"
          "$NDK/bin/llvm-strings" "$OUT" | grep -o 'GIT@[0-9a-f]*' | head -n 1 || true
          echo "--- needed ---"
          "$NDK/bin/llvm-readelf" -d "$OUT" | grep NEEDED || true
          sha256sum "$OUT"

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: libMobileGL-official-16k
          path: libMobileGL-official-16k.so
          if-no-files-found: error
